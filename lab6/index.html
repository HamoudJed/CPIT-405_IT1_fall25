<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 6</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Georgia, serif;
            background: #fff;
            color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .vote-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 36px;
        }

        .vote-btn {
            width: 200px;
            height: 80px;
            font-size: 36px;
            background: #e8e8e8;
            border: 1.5px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .vote-btn:hover { background: #ddd; }
        .vote-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        textarea {
            width: 700px;
            max-width: 90vw;
            height: 180px;
            font-size: 16px;
            font-family: monospace;
            padding: 14px;
            border: 1.5px solid #bbb;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            color: #333;
        }

        textarea:disabled { opacity: 0.6; cursor: not-allowed; }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin-top: 20px;
        }

        .action-btn {
            width: 130px;
            height: 50px;
            font-size: 17px;
            font-weight: 600;
            background: #3a3a3a;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .action-btn:hover { background: #222; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .reset-btn {
            margin-top: 30px;
            padding: 8px 22px;
            font-size: 14px;
            background: transparent;
            border: 1.5px solid #999;
            border-radius: 6px;
            cursor: pointer;
            color: #555;
        }

        .reset-btn:hover { background: #f5f5f5; }

        .comments-section {
            width: 700px;
            max-width: 90vw;
            margin-top: 28px;
        }

        .comment-item {
            background: #f5f5f5;
            border-left: 3px solid #888;
            padding: 10px 14px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 15px;
            font-family: Georgia, serif;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<h1>Lab 6</h1>
<h2>Like or dislike</h2>

<div class="vote-buttons">
    <button class="vote-btn" id="likeBtn" onclick="vote('like')">👍<span id="likeCount">0</span></button>
    <button class="vote-btn" id="dislikeBtn" onclick="vote('dislike')">👎<span id="dislikeCount">0</span></button>
</div>

<h3>Comments</h3>
<textarea id="commentInput" placeholder="Write a comment..."></textarea>

<div class="action-buttons">
    <button class="action-btn" id="submitBtn" onclick="submitComment()">Submit</button>
    <button class="action-btn" onclick="clearComment()">Clear</button>
</div>

<button class="reset-btn" onclick="resetAll()">↺ Reset everything</button>

<div class="comments-section" id="commentsList"></div>

<div class="toast" id="toast"></div>

<script>
    function getCookie(name) {
        const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : null;
    }

    function setCookie(name, value, days) {
        const exp = new Date();
        exp.setDate(exp.getDate() + (days || 7));
        document.cookie = name + '=' + encodeURIComponent(value) + ';expires=' + exp.toUTCString() + ';path=/';
    }

    function deleteCookie(name) {
        document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/';
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }

    let likes    = parseInt(getCookie('lab6_likes')    || '0');
    let dislikes = parseInt(getCookie('lab6_dislikes') || '0');
    let userVote = getCookie('lab6_vote') || null;
    let hasCommented = getCookie('lab6_commented') === 'true';
    let comments = [];

    try {
        const raw = getCookie('lab6_comments');
        if (raw) comments = JSON.parse(raw);
    } catch(e) { comments = []; }

    function updateUI() {
        document.getElementById('likeCount').textContent    = likes;
        document.getElementById('dislikeCount').textContent = dislikes;

        const likeBtn    = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        likeBtn.disabled    = !!userVote;
        dislikeBtn.disabled = !!userVote;

        const submitBtn    = document.getElementById('submitBtn');
        const commentInput = document.getElementById('commentInput');
        submitBtn.disabled    = hasCommented;
        commentInput.disabled = hasCommented;
        if (hasCommented) commentInput.placeholder = 'You have already commented.';
        else commentInput.placeholder = 'Write a comment...';

        const list = document.getElementById('commentsList');
        list.innerHTML = comments.map(c =>
            `<div class="comment-item">${c}</div>`
        ).join('');
    }

    function vote(type) {
        if (userVote) return;
        if (type === 'like') likes++;
        else dislikes++;
        userVote = type;
        setCookie('lab6_likes',    likes);
        setCookie('lab6_dislikes', dislikes);
        setCookie('lab6_vote',     type);
        showToast(type === 'like' ? 'You liked this! 👍' : 'You disliked this! 👎');
        updateUI();
    }

    function submitComment() {
        if (hasCommented) return;
        const input = document.getElementById('commentInput');
        const text  = input.value.trim();
        if (!text) { showToast('Please write a comment first.'); return; }
        comments.push(text);
        hasCommented = true;
        setCookie('lab6_comments',  JSON.stringify(comments));
        setCookie('lab6_commented', 'true');
        showToast('Comment submitted!');
        updateUI();
    }

    function clearComment() {
        document.getElementById('commentInput').value = '';
    }

    function resetAll() {
        if (!confirm('Reset all votes and comments?')) return;
        ['lab6_likes','lab6_dislikes','lab6_vote','lab6_commented','lab6_comments']
            .forEach(deleteCookie);
        likes = 0; dislikes = 0; userVote = null; hasCommented = false; comments = [];
        showToast('Everything has been reset.');
        updateUI();
    }

    updateUI();
</script>
</body>
</html>
